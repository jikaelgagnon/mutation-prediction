repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: v0.17.3
  hooks:
    # Apply safe fixes and formatting, stage them, and allow remaining lint errors.
    - id: ruff-check
      name: Ruff safe fixes and formatting
      entry: python scripts/ruff_commit.py
      types_or: [ python, pyi ]
      args: []
      require_serial: true
