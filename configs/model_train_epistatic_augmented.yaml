# project: mutation-prediction
name: epistatic_biased_aug

data:
  dataset: megascale
  mut_types: [double, double-aug]
  splits: [train, val]
  range: 3 # Paper's cubic weighting for biased augmentation.
  seed: 42 # Reproducible augmentation sampling; not a paper-specified seed.

data_loc:
  # Requires a combined CSV containing Megascale-S-full and Megascale-D-full.
  megascale_csv: data/raw/megascale/csv/Megascale-SD-full.csv
  rosetta_data: data/raw/megascale-rosetta

training:
  num_workers: 4
  output_dir: checkpoints/model-biased-aug
  learn_rate: 0.00001
  epochs: 100
  lr_schedule: true
  batch_size: 256
  shuffle: true

model:
  mutant_embedding: true
  num_final_layers: 2
  freeze_weights: true
  load_pretrained: true
  proteinmpnn_dropout: 0.0
  dropout: 0.1
