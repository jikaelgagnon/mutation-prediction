# Run from the repository root. Set checkpoint with --checkpoint epsilon=PATH.
seed: 42
batch_size: 64
num_workers: 0

# Use the same frozen single-mutant checkpoint that generated epsilon labels.
baseline_checkpoint: checkpoints/thermompnn/ThermoMPNN-ens1.ckpt

datasets:
  megascale_test:
    kind: megascale
    csv: data/processed/thermompnn/Megascale-D-epsilon.csv
    reference_csv: data/raw/megascale/csv/Megascale-D-test.csv
    split: test
    pdb_dir: data/raw/megascale/pdb
    expected_rows: 18574
    expected_proteins: 20
  ptmul_d:
    # Authors' curated PTMUL-D archive, extracted under data/raw/ptmul/.
    enabled: true
    kind: ptmul
    csv: data/raw/ptmul/PTMUL-D/csv/PTMUL-D.csv
    pdb_dir: data/raw/ptmul/PTMUL-D/pdb
    pdb_template: "{pdb}.pdb"
    protein_column: PDB # PDB ID plus chain, e.g. 1VIIA
    mutation_column: MUTS # Original PDB numbering, e.g. A10V;D25G
    target_column: DDG
    target_sign: 1 # +1: source positive = destabilizing; -1: reverse source sign
    expected_rows: 536
    expected_proteins: 83
    batch_size: 8 # Literature proteins can be much larger than MegaScale domains.

models:
  additive:
    kind: additive
    output: ddg
  epsilon:
    kind: checkpoint
    checkpoint: null # Explicit path to a validation-selected .ckpt, never auto-selected on test scores.
    output: epsilon
    output_sign: 1
    group: epsilon

# Table 1: No DA. Reference values are mean +/- SD across three independent runs.
# These are reference results, not predictions generated by this repository.
paper_reference: https://pmc.ncbi.nlm.nih.gov/articles/PMC11659742/#pro70003-tbl-0001
paper_no_da:
  megascale_test:
    rmse_mean: 0.96
    rmse_sd: 0.01
    pearson_mean: 0.54
    pearson_sd: 0.02
    spearman_mean: 0.49
    spearman_sd: 0.01
    n_runs: 3
  ptmul_d:
    rmse_mean: 2.11
    rmse_sd: 0.02
    pearson_mean: 0.36
    pearson_sd: 0.04
    spearman_mean: 0.35
    spearman_sd: 0.03
    n_runs: 3
