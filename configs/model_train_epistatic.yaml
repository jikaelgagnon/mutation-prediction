data:
  dataset: megascale
  mut_types: [double]
  splits: [train, val]

data_loc:
  megascale_csv: data/raw/megascale/csv/Megascale-D-full.csv

training:
  num_workers: 4
  output_dir: checkpoints/model
  learn_rate: 0.00001
  epochs: 100
  lr_schedule: true
  batch_size: 128
  shuffle: true

model:
  hidden_dims: [128, 128]
  mutant_embedding: true
  single_target: true
  num_final_layers: 2
  freeze_weights: true
  load_pretrained: true
  proteinmpnn_dropout: 0.0
  edges: true
  dropout: 0.1
