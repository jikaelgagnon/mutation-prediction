[project]
name = "mutation-prediction"
version = "0.1.0"
description = "ThermoMPNN single-mutant baselines and ProteinMPNN epsilon prediction"
readme = "README.md"
authors = [
    { name = "jikaelgagnon", email = "jikaelgagnon@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "biopython>=1.86",
    "jaxtyping>=0.3.3",
    "lightning>=2.6.6",
    "numpy>=2.0",
    "omegaconf>=2.3.0",
    "pandas>=3.0.6",
    "scipy>=1.15",
    "torch>=2.14.0",
    "torchmetrics>=1.7",
    "tqdm>=4.67",
    "zenodo-get>=3.1.0",
]

[project.optional-dependencies]
tracking = ["wandb>=0.30.0"]
notebooks = ["marimo>=0.25.1", "ipykernel>=7.4.0", "py3dmol>=2.5.5", "altair>=5"]

[project.scripts]
mutation-prediction = "mutation_prediction.model.train:main"
thermompnn-infer = "mutation_prediction.thermompnn:main"
prepare-targets = "mutation_prediction.prepare_targets:main"
download-megascale = "mutation_prediction.data.download:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[tool.ty.rules]
invalid-method-override = "ignore"